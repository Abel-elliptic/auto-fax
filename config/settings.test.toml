# FAXテスト送信用の設定（Step 3）
# 宛先はFAXドライバー側（印刷設定の宛先／送信時のダイアログ）で決まる。
# ⚠ 宛先がテスト宛先（例: Brother テストサービス 1860528244773）であることを必ず確認する。「一斉2」は使わない。

[print]
mode = 'test'
printer_name = 'FAX'

[fax]
# テスト送信先（Brother FAXテストサービス。186＝発信者番号を通知）
test_number = '1860528244773'
# 本番の宛先グループ名（本体宛先表の名前と完全一致。「一斉」とは別）
group_name = '一斉2'
# FAXドライバーの送信画面が出るまで待つ秒数
dialog_timeout = 60

[render]
dpi = 200
margin_mm = 5
mono_mode = 'text'
threshold = 160
pdf_layout = 'auto'
